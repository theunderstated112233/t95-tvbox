PACKAGE_NAME="leds-fd6551"
PACKAGE_VERSION="1.0+t95"
BUILT_MODULE_NAME[0]="leds-fd6551"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# build against the kernel DKMS is targeting, not the running one (the image
# is built in a chroot on the PC, and kernel updates rebuild it on the box)
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
